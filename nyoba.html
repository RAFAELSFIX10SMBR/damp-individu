<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Pesanan</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --line: #dcdad4;
    --accent: #2f6f4f;
    --accent-text: #ffffff;
    --error: #b3261e;
    --ok-bg: #e4f2ea;
    --warn-bg: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --card: #20201d;
      --text: #efeee9;
      --muted: #a3a29b;
      --line: #3a3a35;
      --accent: #6fbf94;
      --accent-text: #10231a;
      --error: #f2877f;
      --ok-bg: #1c3226;
      --warn-bg: #3a3118;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { padding: 8px 4px; text-align: left; }
  th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; }
  .qty { display: inline-flex; align-items: center; gap: 6px; }
  .qty button {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
  }
  .qty span { min-width: 20px; text-align: center; }
  .total-row td { border-top: 1px solid var(--line); }
  .grand td { font-weight: 700; font-size: 1.05rem; }
  label { display: block; font-weight: 500; margin-bottom: 4px; }
  .req { color: var(--error); }
  input[type="text"], input[type="tel"], textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .invalid { border-color: var(--error) !important; }
  .error { color: var(--error); font-size: 0.85rem; margin-top: 4px; min-height: 1.2em; }
  .pay-option { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 400; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn {
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, .qty button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .notice { padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
  .notice.show { display: block; }
  .notice.warn { background: var(--warn-bg); }
  .notice.ok { background: var(--ok-bg); }
  .empty { text-align: center; color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<main>
  <h1>Checkout</h1>

  <div id="notice" class="notice" role="status"></div>

  <section>
    <h2>Ringkasan pesanan</h2>
    <table>
      <thead>
        <tr>
          <th>Menu</th>
          <th class="num">Harga</th>
          <th>Jumlah</th>
          <th class="num">Subtotal</th>
        </tr>
      </thead>
      <tbody id="items"></tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="3">Biaya pengiriman</td>
          <td class="num" id="shipping"></td>
        </tr>
        <tr class="grand">
          <td colspan="3">Total pembayaran</td>
          <td class="num" id="total"></td>
        </tr>
      </tfoot>
    </table>
    <div class="error" id="err-cart"></div>
  </section>

  <section>
    <h2>Data pengiriman</h2>
    <div class="field">
      <label for="alamat">Alamat <span class="req">*</span></label>
      <textarea id="alamat" placeholder="Jalan, nomor, kelurahan, kota"></textarea>
      <div class="error" id="err-alamat"></div>
    </div>
    <div class="field">
      <label for="telp">Nomor telepon penerima <span class="req">*</span></label>
      <input type="tel" id="telp" placeholder="081234567890" inputmode="numeric">
      <div class="error" id="err-telp"></div>
    </div>
    <div class="field">
      <label for="catatan">Catatan (opsional)</label>
      <textarea id="catatan" placeholder="Contoh: tidak pedas"></textarea>
    </div>
  </section>

  <section>
    <h2>Metode pembayaran <span class="req">*</span></h2>
    <label class="pay-option"><input type="radio" name="bayar" value="Transfer Bank"> Transfer Bank</label>
    <label class="pay-option"><input type="radio" name="bayar" value="E-Wallet"> E-Wallet</label>
    <label class="pay-option"><input type="radio" name="bayar" value="COD"> Bayar di tempat (COD)</label>
    <div class="error" id="err-bayar"></div>
  </section>

  <div class="actions">
    <button type="button" class="btn" id="btn-kembali">Kembali ke keranjang</button>
    <button type="button" class="btn primary" id="btn-pesan">Buat pesanan</button>
  </div>
</main>

<script>
  // Data contoh (dalam sistem nyata berasal dari keranjang & database)
  const ONGKIR = 10000;
  let cart = [
    { nama: "Nasi Goreng", harga: 20000, jumlah: 2, stok: 5 },
    { nama: "Es Teh", harga: 5000, jumlah: 1, stok: 10 }
  ];

  const $ = (id) => document.getElementById(id);
  const rupiah = (n) => "Rp " + n.toLocaleString("id-ID");

  function showNotice(text, type) {
    const el = $("notice");
    el.textContent = text;
    el.className = "notice show " + type;
  }

  function render() {
    const tbody = $("items");
    tbody.innerHTML = "";

    if (cart.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">Keranjang masih kosong.</td></tr>';
      $("shipping").textContent = rupiah(0);
      $("total").textContent = rupiah(0);
      return;
    }

    let subtotalAll = 0;
    cart.forEach((item, i) => {
      const subtotal = item.harga * item.jumlah;
      subtotalAll += subtotal;
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + item.nama + "</td>" +
        '<td class="num">' + rupiah(item.harga) + "</td>" +
        '<td><div class="qty">' +
          '<button type="button" aria-label="Kurangi ' + item.nama + '" data-i="' + i + '" data-d="-1">-</button>' +
          "<span>" + item.jumlah + "</span>" +
          '<button type="button" aria-label="Tambah ' + item.nama + '" data-i="' + i + '" data-d="1">+</button>' +
        "</div></td>" +
        '<td class="num">' + rupiah(subtotal) + "</td>";
      tbody.appendChild(tr);
    });

    $("shipping").textContent = rupiah(ONGKIR);
    $("total").textContent = rupiah(subtotalAll + ONGKIR);
  }

  $("items").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const item = cart[btn.dataset.i];
    const baru = item.jumlah + Number(btn.dataset.d);
    if (baru < 1) return;                      // minimal 1
    if (baru > item.stok) {                    // tidak melebihi stok
      showNotice("Stok " + item.nama + " hanya tersisa " + item.stok + ".", "warn");
      return;
    }
    item.jumlah = baru;
    $("notice").className = "notice";
    $("err-cart").textContent = "";
    render();
  });

  function setError(fieldId, errId, msg) {
    $(errId).textContent = msg;
    if (fieldId) $(fieldId).classList.toggle("invalid", !!msg);
  }

  function validate() {
    let ok = true;

    if (cart.length === 0) {
      setError(null, "err-cart", "Keranjang masih kosong.");
      ok = false;
    } else {
      setError(null, "err-cart", "");
    }

    if ($("alamat").value.trim() === "") {
      setError("alamat", "err-alamat", "Alamat pengiriman wajib diisi.");
      ok = false;
    } else {
      setError("alamat", "err-alamat", "");
    }

    if (!/^[0-9]{10,13}$/.test($("telp").value.trim())) {
      setError("telp", "err-telp", "Nomor telepon harus 10-13 digit angka.");
      ok = false;
    } else {
      setError("telp", "err-telp", "");
    }

    if (!document.querySelector('input[name="bayar"]:checked')) {
      setError(null, "err-bayar", "Pilih metode pembayaran.");
      ok = false;
    } else {
      setError(null, "err-bayar", "");
    }

    return ok;
  }

  $("btn-pesan").addEventListener("click", () => {
    if (!validate()) {
      showNotice("Periksa kembali data yang ditandai merah.", "warn");
      return;
    }
    const nomor = "#ORD-" + String(Math.floor(Math.random() * 900) + 100);
    const bayar = document.querySelector('input[name="bayar"]:checked').value;
    const status = bayar === "COD" ? "Bayar saat pesanan tiba" : "Menunggu pembayaran";
    showNotice("Pesanan berhasil dibuat! Nomor pesanan: " + nomor + ". Status pembayaran: " + status + ".", "ok");
    $("btn-pesan").disabled = true;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("btn-kembali").addEventListener("click", () => {
    showNotice("Kembali ke halaman keranjang (simulasi).", "warn");
  });

  render();
</script>
</body>
</html>
