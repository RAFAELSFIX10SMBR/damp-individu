<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pemesanan Makanan</title>
	<style>
		body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
		table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
		td, th { border: 1px solid #999; padding: 6px; }
		input[type="number"] { width: 60px; }
		input[type="text"], textarea { width: 100%; box-sizing: border-box; }
		.error { color: red; }
		.sukses { color: green; font-weight: bold; }
	</style>
</head>
<body>
	<h1>Menu</h1>

	<h2>Makanan</h2>
	<table>
		<tr><th>Menu</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th></tr>
		<tr>
			<td>Nasi Goreng</td>
			<td>20000</td>
			<td><input type="number" min="0" value="0" data-harga="20000"></td>
			<td class="subtotal">0</td>
		</tr>
		<tr>
			<td>Ayam Goreng</td>
			<td>25000</td>
			<td><input type="number" min="0" value="0" data-harga="25000"></td>
			<td class="subtotal">0</td>
		</tr>
	</table>

	<h2>Minuman</h2>
	<table>
		<tr><th>Menu</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th></tr>
		<tr>
			<td>Es Teh</td>
			<td>5000</td>
			<td><input type="number" min="0" value="0" data-harga="5000"></td>
			<td class="subtotal">0</td>
		</tr>
		<tr>
			<td>Es Susu</td>
			<td>8000</td>
			<td><input type="number" min="0" value="0" data-harga="8000"></td>
			<td class="subtotal">0</td>
		</tr>
	</table>

	<p>Biaya pengiriman: <span id="ongkir">0</span></p>
	<p><b>Total pembayaran: <span id="total">0</span></b></p>
	<p class="error" id="err-keranjang"></p>

	<h2>Data Pengiriman</h2>
	<p>
		Alamat *<br>
		<textarea id="alamat" rows="3"></textarea><br>
		<span class="error" id="err-alamat"></span>
	</p>
	<p>
		Nomor telepon *<br>
		<input type="text" id="telp"><br>
		<span class="error" id="err-telp"></span>
	</p>
	<p>
		Catatan (opsional)<br>
		<textarea id="catatan" rows="2"></textarea>
	</p>

	<h2>Metode Pembayaran *</h2>
	<p>
		<label><input type="radio" name="bayar" value="Transfer Bank"> Transfer Bank</label><br>
		<label><input type="radio" name="bayar" value="E-Wallet"> E-Wallet</label><br>
		<label><input type="radio" name="bayar" value="COD"> COD</label><br>
		<span class="error" id="err-bayar"></span>
	</p>

	<button id="btn">Buat Pesanan</button>
	<p class="sukses" id="hasil"></p>

	<script>
		const ONGKIR = 10000;
		const inputs = document.querySelectorAll("input[type=number]");

		function hitung() {
			let total = 0;
			inputs.forEach(function (input) {
				let jumlah = parseInt(input.value) || 0;
				let subtotal = jumlah * input.dataset.harga;
				input.parentElement.nextElementSibling.textContent = subtotal;
				total += subtotal;
			});
			let ongkir = total > 0 ? ONGKIR : 0;
			document.getElementById("ongkir").textContent = ongkir;
			document.getElementById("total").textContent = total + ongkir;
			return total;
		}

		inputs.forEach(function (input) {
			input.addEventListener("input", hitung);
		});

		document.getElementById("btn").addEventListener("click", function () {
			let valid = true;
			let total = hitung();

			let errKeranjang = total === 0 ? "Pilih minimal satu menu." : "";
			let errAlamat = document.getElementById("alamat").value.trim() === "" ? "Alamat wajib diisi." : "";
			let errTelp = /^[0-9]{10,13}$/.test(document.getElementById("telp").value.trim()) ? "" : "Nomor telepon harus 10-13 digit angka.";
			let bayar = document.querySelector("input[name=bayar]:checked");
			let errBayar = bayar ? "" : "Pilih metode pembayaran.";

			document.getElementById("err-keranjang").textContent = errKeranjang;
			document.getElementById("err-alamat").textContent = errAlamat;
			document.getElementById("err-telp").textContent = errTelp;
			document.getElementById("err-bayar").textContent = errBayar;

			if (errKeranjang || errAlamat || errTelp || errBayar) {
				document.getElementById("hasil").textContent = "";
				return;
			}

			let nomor = "#ORD-" + Math.floor(Math.random() * 900 + 100);
			let status = bayar.value === "COD" ? "Bayar saat pesanan tiba" : "Menunggu pembayaran";
			document.getElementById("hasil").textContent =
				"Pesanan berhasil! Nomor pesanan: " + nomor + ". Status pembayaran: " + status + ".";
		});
	</script>
</body>
</html>
